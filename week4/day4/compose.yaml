services:
  web:
    build: ../day3
    ports:
      - "8088:80"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8089:8080"

volumes:
  dbdata:
