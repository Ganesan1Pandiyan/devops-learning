services:
  api:
    build: ./api
    ports:
      - "8090:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Database=postgres;Username=postgres;Password=${POSTGRES_PASSWORD}"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  dbdata:
